## Read by copacabana's matrix.yml: one job per row and configuration. A row names its preset and, when it needs them,
## an image tag, a script to source, a wrapper to run cmake through, args for the configure, and test: false when its
## executables are built for another machine.
runs-on: ubuntu-latest
rows:
  - { name: "gcc"          , preset: "gcc"             , image: "v10" }
  - { name: "clang"        , preset: "clang"           , image: "v10" }
  - { name: "icpx"         , preset: "icpx"            , image: "sycl-v1", setup: "/opt/intel/oneapi/setvars.sh" }
  - { name: "icpx sycl"    , preset: "icpx-sycl"       , image: "sycl-v1", setup: "/opt/intel/oneapi/setvars.sh" }
